# MetaboLM Post-Training Leaderboard Manifest
# This file is the single source of truth for which experiments appear
# in LEADERBOARD.md. Edit this file to add/remove/reorder experiments.
#
# Consumed by: scripts/update_leaderboard.py
# Output: LEADERBOARD.md

experiments:
  - id: E0
    display_name: "E0 — Per-Disease Baseline (Reproduction)"
    phase: phase1
    type: per_disease_sft
    config: configs/reproduce.yaml
    output_dir: outputs/E0_reproduction
    description: "16 independent single-task models (paper baseline)"
    innovation: null
    # Optional: extra eval output dirs to surface as diagnostics in the
    # leaderboard. Each dir follows the per-ckpt contract produced by
    # scripts/eval_e0_global*.py:
    #   <dir>/<ckpt_disease>/metrics_ckpt_<ckpt_disease>.csv
    eval_dirs:
      global_shared: outputs/E0_global_eval
      global_cohort: outputs/E0_global_eval_cohort

  - id: E1
    display_name: "E1 — Hierarchical Multi-Task (Full FT)"
    phase: phase2
    type: multitask_sft
    config: configs/sft_full_ft.yaml
    output_dir: outputs/E1_sft_full_ft
    description: "Joint 16 diseases + 6 ICD-10 chapters, full fine-tuning"
    innovation: "Innovation 1 + 2: hierarchical structure + hierarchy loss"

  - id: E2
    display_name: "E2 — Head-Only"
    phase: phase2
    type: multitask_sft
    config: configs/sft_head_only.yaml
    output_dir: outputs/E2_sft_head_only
    description: "Freeze backbone, train only classification heads"
    innovation: "Innovation 3: PEFT — head only (~0.24%)"

  - id: E3
    display_name: "E3 — Adapter"
    phase: phase2
    type: multitask_sft
    config: configs/sft_adapter.yaml
    output_dir: outputs/E3_sft_adapter
    description: "Freeze backbone + 12-layer adapters (768->64->768)"
    innovation: "Innovation 3: PEFT — adapter (~1.61%)"

  - id: E4
    display_name: "E4 — LoRA"
    phase: phase2
    type: multitask_sft
    config: configs/sft_lora.yaml
    output_dir: outputs/E4_sft_lora
    description: "Freeze backbone + LoRA rank-8 on Q/V projections"
    innovation: "Innovation 3: PEFT — LoRA (~0.58%)"

  - id: E5
    display_name: "E5 — GRPO Calibration Reward"
    phase: phase3
    type: multitask_rl
    config: configs/rl_calibration.yaml
    output_dir: outputs/E5_grpo_calibration
    description: "GRPO with calibration reward on best SFT checkpoint"
    innovation: "Phase 3: RL exploration — calibration"

  - id: E6
    display_name: "E6 — GRPO Hierarchy Reward"
    phase: phase3
    type: multitask_rl
    config: configs/rl_hierarchy.yaml
    output_dir: outputs/E6_grpo_hierarchy
    description: "GRPO with hierarchy consistency reward"
    innovation: "Phase 3: RL exploration — hierarchy"

experiment_groups:
  # EXP-000 (2026-04-19) — Hierarchy-loss μ sweep on E1 Full FT.
  # Rendering is optional for the existing update_leaderboard.py; this block is
  # forward-compatible metadata consumed by scripts/analyze_mu_sweep.py.
  - id: mu_sweep
    display_name: "Hierarchy Loss μ Sweep (E1 ablation)"
    parent: E1
    description: "μ ∈ {0.0, 0.1, 0.5, 1.0, 3.0, 10.0} on sft_full_ft baseline"
    render_as: subtable
    sort_by: mu_hierarchy
    members:
      - id: E1_mu_0.0
        config: configs/sft_full_ft_mu_0.0.yaml
        output_dir: outputs/E1_mu_sweep/mu_0.0
        mu_hierarchy: 0.0
      - id: E1_mu_0.1
        config: configs/sft_full_ft_mu_0.1.yaml
        output_dir: outputs/E1_mu_sweep/mu_0.1
        mu_hierarchy: 0.1
      - id: E1_mu_0.5
        config: configs/sft_full_ft_mu_0.5.yaml
        output_dir: outputs/E1_mu_sweep/mu_0.5
        mu_hierarchy: 0.5
      - id: E1_mu_1.0
        config: configs/sft_full_ft_mu_1.0.yaml
        output_dir: outputs/E1_mu_sweep/mu_1.0
        mu_hierarchy: 1.0
      - id: E1_mu_3.0
        config: configs/sft_full_ft_mu_3.0.yaml
        output_dir: outputs/E1_mu_sweep/mu_3.0
        mu_hierarchy: 3.0
      - id: E1_mu_10.0
        config: configs/sft_full_ft_mu_10.0.yaml
        output_dir: outputs/E1_mu_sweep/mu_10.0
        mu_hierarchy: 10.0

# Disease names — MUST match the keys used in multitask_metrics.csv and
# src/data/endpoints.py. Order below matches DISEASE_ENDPOINTS declaration
# order in endpoints.py (chapter groupings: endocrine, circulatory,
# musculoskeletal, respiratory, neurological, cancers).
diseases:
  - T2D
  - obesity
  - hypertension
  - ischemic_heart
  - atrial_fib
  - heart_failure
  - rheumatoid
  - asthma
  - dementia
  - copd
  - stroke
  - parkinsons
  - breast_cancer
  - colon_cancer
  - lung_cancer
  - prostate_cancer
