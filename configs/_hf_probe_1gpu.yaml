# HF Trainer single-card probe — equivalence check against 2026-04-19 08:02 old-trainer probe.
# Same hyperparams as configs/sft_full_ft.yaml except num_epochs=1.
experiment: _hf_probe_1gpu
seed: 42

data:
  train_path: data/processed/train.csv
  val_path: data/processed/val.csv
  correlation_matrix_path: data/processed/correlation_matrix.pt
  num_metabolites: 168

model:
  pretrained_ckpt: weights/best_metabolite_bert_model.pt
  head_type: hierarchical
  freeze_strategy: none
  hidden_size: 768
  num_diseases: 16
  proj_size: 256

training:
  mode: sft
  batch_size: 512
  learning_rate: 2.0e-5
  num_epochs: 1
  warmup_ratio: 0.1
  weight_decay: 0.01
  lambda_chapter: 1.0
  mu_hierarchy: 0.1

output_dir: outputs/_hf_probe_1gpu
