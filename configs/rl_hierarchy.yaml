# E6: GRPO with hierarchy consistency reward
experiment: E6_grpo_hierarchy
seed: 42

data:
  train_path: data/processed/train.csv
  val_path: data/processed/val.csv
  correlation_matrix_path: data/processed/correlation_matrix.pt
  num_metabolites: 168

model:
  pretrained_ckpt: weights/best_metabolite_bert_model.pt
  sft_ckpt: outputs/E1_sft_full_ft/best_model.pt   # Start from best SFT
  head_type: hierarchical
  freeze_strategy: none
  hidden_size: 768
  num_diseases: 16
  proj_size: 256

training:
  mode: rl
  reward: hierarchy
  batch_size: 128
  learning_rate: 1.0e-5
  num_epochs: 20
  warmup_ratio: 0.1
  weight_decay: 0.01
  group_size: 4
  kl_coeff: 0.1

output_dir: outputs/E6_grpo_hierarchy
